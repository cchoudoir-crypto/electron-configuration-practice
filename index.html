<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Configuration Lab</title>
<meta name="description" content="Practice electron configurations, orbital diagrams, excited states, Lewis dot diagrams, and ion charges.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: lab-notebook cards on a cool slate ground; one ink-blue accent; s/p/d/f block colors carried through every table, tag and diagram. */
:root {
  --bg: #eef1f5; --surface: #ffffff; --ink: #142031; --muted: #566377; --line: #d5dce6; --soft: #f5f7fa;
  --accent: #2343a3; --accent-soft: #e3e9f8; --on-accent: #ffffff;
  --s: #cf3e56; --p: #2b74c9; --d: #c98a10; --f: #23907f;
  --good: #1d7f47; --bad: #bd3434; --warn: #9a6a0c;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151e; --surface: #18212d; --ink: #e6ebf2; --muted: #9aa7b8; --line: #2c3949; --soft: #1e2835;
    --accent: #8ea8f5; --accent-soft: #24304a; --on-accent: #0f151e;
    --s: #f07186; --p: #6aa8f0; --d: #e6b44a; --f: #4cc4b0; --good: #5bc98a; --bad: #f07a7a; --warn: #e6b44a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151e; --surface: #18212d; --ink: #e6ebf2; --muted: #9aa7b8; --line: #2c3949; --soft: #1e2835;
  --accent: #8ea8f5; --accent-soft: #24304a; --on-accent: #0f151e;
  --s: #f07186; --p: #6aa8f0; --d: #e6b44a; --f: #4cc4b0; --good: #5bc98a; --bad: #f07a7a; --warn: #e6b44a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0 0 .5rem; }
h2 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.01em; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0 0 .75rem; max-width: 70ch; }
code { background: var(--soft); padding: 0 .3em; border-radius: 4px; }
mark { background: color-mix(in srgb, var(--d) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }
.tiny { font-size: .85rem; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* header */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top-in { max-width: 1120px; margin: 0 auto; padding: .7rem 16px .5rem; display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; align-items: center; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: .55rem; }
.brand .mk { display: inline-grid; grid-template-columns: repeat(2, 9px); gap: 2px; }
.brand .mk i { width: 9px; height: 9px; border-radius: 2px; display: block; }
#nav { display: flex; gap: .3rem 1rem; flex-wrap: wrap; overflow-x: auto; }
.ng { display: flex; align-items: center; gap: .2rem; flex-wrap: wrap; }
.ng-l { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: .2rem; }
#nav a { text-decoration: none; color: var(--ink); padding: .3rem .6rem; border-radius: 999px; font-size: .92rem; white-space: nowrap; }
#nav a:hover { background: var(--soft); }
#nav a[aria-current="page"] { background: var(--accent); color: var(--on-accent); }

main { max-width: 1120px; margin: 0 auto; padding: 1.25rem 16px 4rem; display: grid; gap: 1.1rem; }
#progWrap { max-width: 1120px; margin: 0 auto; padding: .9rem 16px 0; }
#progress { display: flex; flex-wrap: wrap; gap: .6rem; align-items: stretch; }
.pg { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .45rem .7rem; min-width: 150px; flex: 1 1 150px; }
.pg-top { display: flex; gap: .4rem; font-size: .82rem; align-items: baseline; }
.pg-top span { color: var(--muted); }
.pg-bar { height: 5px; background: var(--soft); border-radius: 3px; margin: .3rem 0 .2rem; overflow: hidden; }
.pg-bar i { display: block; height: 100%; background: var(--good); }
.pg-num { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.3rem 1.4rem; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; margin: 0 0 .3rem; }
.lede { color: var(--muted); }
.intro h2 { font-size: 1.3rem; }
.lts { margin: .5rem 0 .8rem; padding-left: 1.2rem; display: grid; gap: .35rem; }
.lts b { color: var(--accent); margin-right: .3rem; }
.bul { padding-left: 1.2rem; display: grid; gap: .25rem; }
.cta { background: var(--accent-soft); border-color: transparent; }

/* tags & block colors */
.tag { display: inline-block; padding: .05rem .5rem; border-radius: 6px; font-weight: 700; font-size: .9rem; }
.b-s { --bc: var(--s); } .b-p { --bc: var(--p); } .b-d { --bc: var(--d); } .b-f { --bc: var(--f); }
.tag, .lg { background: color-mix(in srgb, var(--bc) 18%, var(--surface)); color: var(--ink); border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem; margin: .6rem 0 0; }
.lg { font-size: .8rem; padding: .1rem .55rem; border-radius: 999px; }
.order { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; margin: .4rem 0; }
.arr { color: var(--muted); }
.arr.big { font-size: 1.6rem; align-self: center; }

/* address */
.addr { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; margin: .5rem 0 1rem; }
.addr-big { font-family: var(--display); font-weight: 800; font-size: 4.2rem; line-height: 1; padding: .3rem 1rem; background: var(--soft); border-radius: var(--r); }
.addr-big sup { font-size: .5em; }
.a-n { color: var(--accent); } .a-l { color: var(--p); } .a-e { color: var(--s); }
.addr-key { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; }
.addr-key .k { display: inline-grid; place-items: center; width: 1.8rem; height: 1.8rem; border-radius: 6px; background: var(--soft); font-family: var(--display); font-weight: 800; margin-right: .5rem; }
.tbl-wrap { overflow-x: auto; margin: .5rem 0 1rem; }
.tbl { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: .45rem .7rem; text-align: left; white-space: nowrap; }
.tbl th { font-size: .82rem; color: var(--muted); font-weight: 700; }

.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
.rule { background: var(--soft); border-radius: 10px; padding: 1rem; }
.pair-ex { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
.pair-ex.wide { gap: 2rem; }
figure { margin: 0; display: grid; gap: .35rem; justify-items: start; }
figcaption { font-size: .85rem; }
figcaption.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
figcaption.no::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.worked { background: var(--soft); border-left: 4px solid var(--accent); padding: .8rem 1rem; border-radius: 0 10px 10px 0; margin-top: 1rem; }
.cfg { white-space: normal; }
.cfg .sl { white-space: nowrap; }
.cfg .core { font-weight: 700; color: var(--accent); }
.or { margin: 0 .6rem; color: var(--muted); font-size: .85rem; }
.big-cfg { font-size: 1.3rem; }
sup { font-size: .68em; line-height: 0; }

/* orbital diagrams */
.od { display: inline-flex; gap: .6rem; align-items: stretch; }
.od-axis { width: 1.4rem; position: relative; border-right: 2px solid var(--muted); margin-right: .2rem; }
.od-axis::before { content: ""; position: absolute; right: -7px; top: -2px; border: 6px solid transparent; border-bottom: 9px solid var(--muted); border-top: 0; }
.od-axis span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); white-space: nowrap; font-size: .72rem; color: var(--muted); letter-spacing: .05em; }
.od-rows { display: flex; flex-direction: column; gap: .35rem; padding-top: .4rem; }
.od-row { display: flex; align-items: center; gap: .5rem; }
.od-row.t-p { margin-left: 3.2rem; } .od-row.t-d { margin-left: 6.4rem; }
.od-lab { width: 2rem; text-align: right; font-weight: 700; font-size: .92rem; }
.od-row.t-s .od-lab { color: var(--s); } .od-row.t-p .od-lab { color: var(--p); } .od-row.t-d .od-lab { color: var(--d); } .od-row.t-f .od-lab { color: var(--f); }
.od-boxes { display: flex; }
.ob { width: 2.6rem; height: 2.6rem; border: 2px solid var(--ink); background: var(--surface); display: grid; place-items: center; padding: 0; margin-left: -2px; color: var(--ink); font: inherit; }
.ob:first-child { margin-left: 0; }
.ob svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.od.live .ob { cursor: pointer; }
.od.live .ob:hover { background: var(--accent-soft); }
.od.live .ob:focus-visible { position: relative; z-index: 1; }
.od-row.mark .ob { background: color-mix(in srgb, var(--d) 16%, var(--surface)); }
.od.small .ob { width: 2.1rem; height: 2.1rem; }
.od.small .od-row.t-p { margin-left: 2.6rem; } .od.small .od-row.t-d { margin-left: 2.6rem; }
.od.small .od-axis { display: none; }
.od-core { font-size: .85rem; color: var(--muted); padding-left: 2.5rem; border-top: 1px dashed var(--line); padding-top: .3rem; }
.od-count { font-size: .92rem; margin: .6rem 0; }

/* Lewis */
.lw { display: inline-grid; grid-template-columns: 2.4rem 3.4rem 2.4rem; grid-template-rows: 2.4rem 3.4rem 2.4rem; grid-template-areas: ". t ." "l c r" ". b ."; }
.lw.small { grid-template-columns: 1.4rem 2.6rem 1.4rem; grid-template-rows: 1.4rem 2.6rem 1.4rem; }
.lw-sym { grid-area: c; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 2.1rem; }
.lw.small .lw-sym { font-size: 1.5rem; }
.lw-side { display: flex; align-items: center; justify-content: center; gap: 5px; border: 0; background: none; padding: 0; color: var(--ink); font: inherit; }
.lw-top { grid-area: t; } .lw-bottom { grid-area: b; } .lw-left { grid-area: l; flex-direction: column; } .lw-right { grid-area: r; flex-direction: column; }
.lw-side i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); display: block; }
.lw.small .lw-side i { width: 7px; height: 7px; }
.lw.live .lw-side { border: 2px dashed var(--line); border-radius: 8px; cursor: pointer; margin: 2px; }
.lw.live .lw-side:hover { border-color: var(--accent); background: var(--accent-soft); }
.lw-hint { color: var(--muted); font-size: .9rem; }
.lw-ion { display: inline-flex; align-items: center; }
.lw-ion .br { font-size: 3.2rem; font-weight: 300; line-height: 1; color: var(--muted); }
.lw-q { font-weight: 700; font-size: 1.1rem; align-self: flex-start; line-height: 1.2; }
.lw-row { display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center; margin: .6rem 0; }
.lw-row figure { justify-items: center; }
.lw-work { display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }

/* periodic table */
.pt-wrap { overflow-x: auto; padding-bottom: .3rem; }
.pt { display: grid; grid-template-columns: repeat(18, minmax(36px, 1fr)); grid-template-rows: repeat(7, auto) .6rem auto auto; gap: 2px; min-width: 680px; }
.pt.mini { grid-template-columns: repeat(18, minmax(30px, 1fr)); min-width: 560px; }
.pc { border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent); background: color-mix(in srgb, var(--bc) 14%, var(--surface)); color: var(--ink); border-radius: 4px; padding: 2px 3px; display: grid; text-align: left; font: inherit; min-height: 2.6rem; }
.pt.mini .pc { min-height: 2rem; }
.pc small { font-size: .6rem; color: var(--muted); line-height: 1; font-variant-numeric: tabular-nums; }
.pc b { font-size: .95rem; line-height: 1.1; }
.pt.mini .pc b { font-size: .8rem; }
button.pc { cursor: pointer; }
button.pc:hover { background: color-mix(in srgb, var(--bc) 32%, var(--surface)); }
.pc.filled { background: color-mix(in srgb, var(--bc) 42%, var(--surface)); }
.pc.faded { opacity: .45; }
.pc.out { opacity: .4; }
.pc.exc { box-shadow: inset 0 0 0 2px var(--ink); }
.pc.sel { outline: 3px solid var(--ink); outline-offset: 0; position: relative; z-index: 1; opacity: 1; }
.pt-flabel { font-size: .72rem; color: var(--muted); align-self: center; text-align: right; padding-right: 4px; }
.pt-pop { margin-top: .6rem; padding: .6rem; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }

/* explorer */
.det { display: grid; grid-template-columns: minmax(170px, 210px) 1fr auto; gap: 1.5rem; }
@media (max-width: 860px) { .det { grid-template-columns: 1fr; } }
.tile { border: 2px solid var(--bc); background: color-mix(in srgb, var(--bc) 18%, var(--surface)); border-radius: 12px; padding: .7rem 1rem; display: grid; width: 9rem; }
.tile small { font-variant-numeric: tabular-nums; color: var(--muted); }
.tile b { font-family: var(--display); font-size: 3rem; line-height: 1; }
.facts { list-style: none; padding: 0; margin: .8rem 0 0; display: grid; gap: .25rem; font-size: .95rem; }
.path { margin: .2rem 0 1rem; padding-left: 0; list-style: none; display: grid; gap: .15rem; }
.exc-note { display: block; margin-top: .5rem; background: color-mix(in srgb, var(--d) 16%, var(--surface)); border-left: 4px solid var(--d); padding: .5rem .8rem; border-radius: 0 8px 8px 0; font-size: .95rem; }

/* watch */
.w-ctl { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
.w-ctl input[type=range] { flex: 1 1 200px; accent-color: var(--accent); }
.w-grid { display: grid; grid-template-columns: auto 1fr; gap: 1.5rem; align-items: start; }
@media (max-width: 760px) { .w-grid { grid-template-columns: 1fr; } }
.why { background: var(--soft); padding: .7rem .9rem; border-radius: 10px; min-height: 4.5rem; }

/* practice */
.p-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .8rem; margin-bottom: 1rem; }
.p-ctls { display: flex; gap: .8rem; flex-wrap: wrap; align-items: flex-start; }
.ctl { font-size: .85rem; color: var(--muted); display: flex; gap: .4rem; align-items: center; }
.ctl select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .3rem .5rem; }
.ctl.chk input { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
.prompt { margin-bottom: 1rem; }
.el-big { display: inline-flex; align-items: baseline; gap: .7rem; background: var(--soft); padding: .4rem 1rem; border-radius: 10px; margin-bottom: .3rem; }
.el-big b { font-family: var(--display); font-size: 2.2rem; line-height: 1.1; }
.el-big span { font-size: 1.1rem; }
.show { background: var(--soft); border-radius: 10px; padding: .8rem 1rem; display: inline-block; max-width: 100%; overflow-x: auto; }
.show .big-cfg { margin: 0; }
.field { display: grid; gap: .3rem; margin: 0 0 1rem; border: 0; padding: 0; }
.field label, .field legend { font-weight: 700; font-size: .95rem; padding: 0; margin-bottom: .2rem; }
.row-in { display: flex; gap: .5rem; flex-wrap: wrap; }
.txt { font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: .55rem .75rem; width: 100%; max-width: 32rem; }
.el-in { max-width: 16rem; }
.txt:focus { border-color: var(--accent); outline: none; }
.preview { min-height: 1.6rem; font-size: 1.2rem; }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg label { border: 2px solid var(--line); border-radius: 999px; padding: .3rem .85rem; cursor: pointer; font-weight: 400; display: flex; gap: .4rem; align-items: center; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg input { accent-color: var(--accent); }
.charges label { min-width: 4.2rem; justify-content: center; font-variant-numeric: tabular-nums; }
.mc { display: grid; gap: .5rem; }
.mc label { display: flex; gap: .6rem; align-items: flex-start; border: 2px solid var(--line); border-radius: 10px; padding: .55rem .8rem; cursor: pointer; font-weight: 400; }
.mc label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.mc input { margin-top: .35rem; accent-color: var(--accent); }
.actions, .row-btn { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 .5rem; }
.btn { font: inherit; font-weight: 700; border-radius: 10px; padding: .55rem 1rem; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: var(--soft); }
.btn.sm { padding: .3rem .7rem; font-size: .88rem; }
.fb { display: flex; gap: .7rem; padding: .8rem 1rem; border-radius: 10px; margin-top: .6rem; border-left: 5px solid; }
.fb-good { background: color-mix(in srgb, var(--good) 12%, var(--surface)); border-color: var(--good); }
.fb-bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); border-color: var(--bad); }
.fb-warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: var(--warn); }
.fb-info { background: var(--accent-soft); border-color: var(--accent); }
.fb-ic { font-weight: 800; font-size: 1.1rem; width: 1.4rem; text-align: center; }
.fb-good .fb-ic { color: var(--good); } .fb-bad .fb-ic { color: var(--bad); } .fb-warn .fb-ic { color: var(--warn); } .fb-info .fb-ic { color: var(--accent); }
.hints { display: grid; gap: .4rem; margin-top: .6rem; }
.hint { background: var(--soft); border-radius: 10px; padding: .6rem .9rem; font-size: .95rem; }
.hint .path { margin: .3rem 0 0; }
.exc-why { background: color-mix(in srgb, var(--d) 14%, var(--surface)); border-radius: 10px; padding: .8rem 1rem; margin: .6rem 0 1rem; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.2rem; margin-bottom: 1rem; }
.pg-side { display: flex; flex-direction: column; gap: .3rem; justify-content: center; }
a.btn { text-decoration: none; text-align: center; }
.req { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .8rem; max-width: 46rem; }
.req li { display: grid; grid-template-columns: 1.8rem 1fr; gap: .6rem; align-items: start; }
.rq-ic { font-size: 1.2rem; font-weight: 800; color: var(--muted); text-align: center; }
.req li.met .rq-ic { color: var(--good); }
.req li.opt.met .rq-ic { color: var(--d); }
.req .pg-bar { max-width: 22rem; }
.cert-form { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
.cert-form .field { flex: 1 1 260px; }
.cert-prev img { width: 100%; max-width: 900px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .12); display: block; }
body.ref-open .top { position: static; }
#ptFab { position: fixed; right: 16px; bottom: 16px; z-index: 20; box-shadow: 0 6px 18px rgb(0 0 0 / .22); border-radius: 999px; padding: .65rem 1.2rem; }
body.ref-open #ptFab { bottom: calc(min(46vh, 420px) + 12px); }
#ptDrawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; height: min(46vh, 420px); background: var(--surface); border-top: 2px solid var(--accent); box-shadow: 0 -8px 28px rgb(0 0 0 / .18); display: flex; flex-direction: column; }
#ptDrawer[hidden] { display: none; }
body.ref-open main { padding-bottom: calc(min(46vh, 420px) + 3rem); }
.pd-head { display: flex; align-items: center; gap: 1rem; padding: .5rem 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pd-head h2 { font-size: 1.05rem; margin: 0; margin-right: auto; }
#ptBody { overflow: auto; padding: .5rem 16px 1rem; flex: 1; }

<body>
<header class="top"><div class="top-in"><div class="brand"><span class="mk" aria-hidden="true"><i style="background:var(--s)"></i><i style="background:var(--p)"></i><i style="background:var(--d)"></i><i style="background:var(--f)"></i></span>Electron Configuration Lab</div><nav id="nav" aria-label="Sections"></nav></div></header>
<div id="progWrap" hidden><div id="progress" aria-label="Your progress"></div></div>
<main id="view"></main>
<button type="button" id="ptFab" class="btn primary" aria-controls="ptDrawer" aria-expanded="false">Periodic table</button>
<aside id="ptDrawer" hidden aria-label="Periodic table reference">
  <div class="pd-head"><h2>Periodic table</h2><label class="ctl chk"><input type="checkbox" id="ptLabels"> Show sublevel labels</label><button type="button" class="btn ghost sm" id="ptClose">Close</button></div>
  <div id="ptBody"></div>
</aside>
<script>
/* ===== Pure chemistry logic (tested separately in node) ===== */
const SYMS = "H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
const NAMES = "Hydrogen Helium Lithium Beryllium Boron Carbon Nitrogen Oxygen Fluorine Neon Sodium Magnesium Aluminum Silicon Phosphorus Sulfur Chlorine Argon Potassium Calcium Scandium Titanium Vanadium Chromium Manganese Iron Cobalt Nickel Copper Zinc Gallium Germanium Arsenic Selenium Bromine Krypton Rubidium Strontium Yttrium Zirconium Niobium Molybdenum Technetium Ruthenium Rhodium Palladium Silver Cadmium Indium Tin Antimony Tellurium Iodine Xenon Cesium Barium Lanthanum Cerium Praseodymium Neodymium Promethium Samarium Europium Gadolinium Terbium Dysprosium Holmium Erbium Thulium Ytterbium Lutetium Hafnium Tantalum Tungsten Rhenium Osmium Iridium Platinum Gold Mercury Thallium Lead Bismuth Polonium Astatine Radon Francium Radium Actinium Thorium Protactinium Uranium Neptunium Plutonium Americium Curium Berkelium Californium Einsteinium Fermium Mendelevium Nobelium Lawrencium Rutherfordium Dubnium Seaborgium Bohrium Hassium Meitnerium Darmstadtium Roentgenium Copernicium Nihonium Flerovium Moscovium Livermorium Tennessine Oganesson".split(" ");

const FILL = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
const CAP = { s: 2, p: 6, d: 10, f: 14 };
const ORB = { s: 1, p: 3, d: 5, f: 7 };
const LIDX = { s: 0, p: 1, d: 2, f: 3 };
const NOBLE = [2, 10, 18, 36, 54, 86, 118];

const nOf = l => +l[0];
const tOf = l => l[1];
const capOf = l => CAP[tOf(l)];

/* Actual ground states that break the Aufbau prediction */
const EXC = {
  24: { '4s': 1, '3d': 5 },   // Cr
  29: { '4s': 1, '3d': 10 },  // Cu
  41: { '5s': 1, '4d': 4 },   // Nb
  42: { '5s': 1, '4d': 5 },   // Mo
  44: { '5s': 1, '4d': 7 },   // Ru
  45: { '5s': 1, '4d': 8 },   // Rh
  46: { '5s': 0, '4d': 10 },  // Pd
  47: { '5s': 1, '4d': 10 },  // Ag
  57: { '4f': 0, '5d': 1 },   // La
  58: { '4f': 1, '5d': 1 },   // Ce
  64: { '4f': 7, '5d': 1 },   // Gd
  78: { '6s': 1, '5d': 9 },   // Pt
  79: { '6s': 1, '5d': 10 },  // Au
  89: { '5f': 0, '6d': 1 },   // Ac
  90: { '5f': 0, '6d': 2 },   // Th
  91: { '5f': 2, '6d': 1 },   // Pa
  92: { '5f': 3, '6d': 1 },   // U
  93: { '5f': 4, '6d': 1 },   // Np
  96: { '5f': 7, '6d': 1 },   // Cm
  103: { '6d': 0, '7p': 1 }   // Lr
};

function aufbauCounts(e) {
  const c = {};
  for (const l of FILL) {
    if (e <= 0) break;
    const k = Math.min(capOf(l), e);
    c[l] = k; e -= k;
  }
  return c;
}
function groundCounts(Z) {
  const c = aufbauCounts(Z);
  if (EXC[Z]) for (const [l, k] of Object.entries(EXC[Z])) c[l] = k;
  return clean(c);
}
function clean(c) { const o = {}; for (const l in c) if (c[l] > 0) o[l] = c[l]; return o; }
function total(c) { return Object.values(c).reduce((a, b) => a + b, 0); }
function sameCounts(a, b) {
  a = clean(a); b = clean(b);
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(l => a[l] === b[l]);
}
function subtract(a, b) { const o = { ...a }; for (const l in b) o[l] = (o[l] || 0) - b[l]; return clean(o); }
function coreZ(Z) { let c = null; for (const n of NOBLE) if (n < Z) c = n; return c; }
function hasFullCore(c, cz) { const core = groundCounts(cz); return Object.keys(core).every(l => (c[l] || 0) >= core[l]); }
function sortedLabels(c) {
  const known = FILL.filter(l => c[l] > 0);
  const extra = Object.keys(c).filter(l => c[l] > 0 && !FILL.includes(l));
  return known.concat(extra);
}

/* Block / position of an element (Lu and Lr sit in group 3; La–Yb and Ac–No form the f rows) */
function lastAufbauSub(Z) { const c = aufbauCounts(Z); return FILL.filter(l => c[l] > 0).pop(); }
function blockOf(Z) { return tOf(lastAufbauSub(Z)); }
function posOf(Z) {
  if (Z === 1) return { r: 1, c: 1 };
  if (Z === 2) return { r: 1, c: 18 };
  if (Z <= 18) { const p = Z <= 10 ? 2 : 3, s = Z <= 10 ? 3 : 11, i = Z - s; return { r: p, c: i < 2 ? i + 1 : i + 11 }; }
  if (Z <= 36) return { r: 4, c: Z - 18 };
  if (Z <= 54) return { r: 5, c: Z - 36 };
  if (Z <= 56) return { r: 6, c: Z - 54 };
  if (Z <= 70) return { r: 9, c: Z - 54, f: true };
  if (Z === 71) return { r: 6, c: 3 };
  if (Z <= 86) return { r: 6, c: Z - 68 };
  if (Z <= 88) return { r: 7, c: Z - 86 };
  if (Z <= 102) return { r: 10, c: Z - 86, f: true };
  if (Z === 103) return { r: 7, c: 3 };
  return { r: 7, c: Z - 100 };
}
function periodOf(Z) { let p = 1; for (const n of NOBLE) { if (Z > n) p++; } return p; }
function isMainGroup(Z) { const b = blockOf(Z); return b === 's' || b === 'p'; }
function groupOf(Z) { const p = posOf(Z); return p.f ? null : p.c; }

/* Valence electrons (main group only) = electrons in the highest energy level */
function valenceOf(Z) {
  const c = groundCounts(Z);
  const nMax = Math.max(...Object.keys(c).map(nOf));
  return Object.keys(c).filter(l => nOf(l) === nMax).reduce((a, l) => a + c[l], 0);
}
/* Typical ion charge for main-group elements; 0 = does not usually form a simple ion */
function ionCharge(Z) {
  const g = groupOf(Z);
  if (Z === 2) return 0;
  if (g === 1) return 1; if (g === 2) return 2; if (g === 13) return 3;
  if (g === 14) return 0; if (g === 15) return -3; if (g === 16) return -2;
  if (g === 17) return -1; if (g === 18) return 0;
  return null;
}
/* Configuration of an ion: cations lose from highest n first (p before s) */
function ionCounts(Z, q) {
  if (q < 0) return groundCounts(Z - q);
  const c = { ...groundCounts(Z) };
  let k = q;
  const order = Object.keys(c).sort((a, b) => nOf(b) - nOf(a) || LIDX[tOf(b)] - LIDX[tOf(a)]);
  for (const l of order) { while (k > 0 && c[l] > 0) { c[l]--; k--; } }
  return clean(c);
}
function isoNoble(c) { const t = total(c); return NOBLE.includes(t) && sameCounts(c, groundCounts(t)) ? t : null; }

/* Reading path across the periodic table: which row each sublevel is read in */
function rowOfSub(l) { const n = nOf(l), t = tOf(l); return t === 'd' ? n + 1 : t === 'f' ? n + 2 : n; }

/* ----- Parsing a student's typed configuration ----- */
const SUPD = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9' };
function parseConfig(str) {
  const res = { counts: {}, order: [], errors: [], core: null, empty: false };
  let s = (str || '').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m => [...m].map(ch => SUPD[ch]).join('') + ' ').replace(/\^/g, '').replace(/[,;]/g, ' ');
  s = s.replace(/\]/g, '] ').replace(/\[/g, ' [').trim();
  if (!s) { res.empty = true; res.errors.push('Type a configuration first, like 1s2 2s2 2p3.'); return res; }
  const toks = s.split(/\s+/);
  const seen = new Set();
  toks.forEach((tok, i) => {
    let m;
    if ((m = tok.match(/^\[([A-Za-z]{1,2})\]$/))) {
      const sym = m[1][0].toUpperCase() + m[1].slice(1).toLowerCase();
      const Z = SYMS.indexOf(sym) + 1;
      if (!NOBLE.includes(Z)) { res.errors.push(`[${sym}] isn't a noble gas. The core in brackets must be He, Ne, Ar, Kr, Xe, or Rn.`); return; }
      if (i !== 0) { res.errors.push('Put the noble gas core first, like [Ne] 3s2 3p4.'); return; }
      res.core = Z;
      const cc = groundCounts(Z);
      for (const l in cc) { res.counts[l] = cc[l]; seen.add(l); }
      return;
    }
    if ((m = tok.match(/^([1-9])([spdfSPDF])(\d{1,2})$/))) {
      const l = m[1] + m[2].toLowerCase(), k = +m[3];
      const n = +m[1];
      if (LIDX[l[1]] >= n) { res.errors.push(`There is no ${l} sublevel. Energy level ${n} only has ${['s', 's and p', 's, p, and d', 's, p, d, and f'][Math.min(n, 4) - 1]}.`); return; }
      if (seen.has(l)) {
        res.errors.push(res.core && groundCounts(res.core)[l] ? `[${SYMS[res.core - 1]}] already includes ${l}. Only write the electrons after the core.` : `You listed ${l} more than once. Combine them into one sublevel.`);
        return;
      }
      if (k > capOf(l)) { res.errors.push(`${l} holds at most ${capOf(l)} electrons (${ORB[l[1]]} orbital${ORB[l[1]] > 1 ? 's' : ''} × 2). You wrote ${l}${k}.`); }
      if (k === 0) { res.errors.push(`Leave out empty sublevels: ${l}0 isn't needed.`); return; }
      seen.add(l); res.counts[l] = k; res.order.push(l);
      return;
    }
    if (/^[1-9][spdf]$/i.test(tok)) { res.errors.push(`${tok} needs an electron count after it, like ${tok}2.`); return; }
    if (/^[1-9][spdf]\d+[1-9][spdf]/i.test(tok)) { res.errors.push(`Put a space between sublevels: "${tok}" should be split up, like 1s2 2s2.`); return; }
    res.errors.push(`I can't read "${tok}". Write each sublevel as level + letter + electrons, like 2p6, with spaces between.`);
  });
  return res;
}
function orderIsFillOrder(order) {
  const idx = order.map(l => FILL.indexOf(l));
  for (let i = 1; i < idx.length; i++) if (idx[i] < idx[i - 1]) return false;
  return true;
}
/* First place where a higher sublevel has electrons while a lower one is not full */
function aufbauGap(c) {
  for (let i = 0; i < FILL.length; i++) {
    const l = FILL[i];
    if ((c[l] || 0) < capOf(l)) {
      const hi = FILL.slice(i + 1).find(h => c[h] > 0);
      if (hi) return { low: l, high: hi };
      return null;
    }
  }
  return null;
}

/* ----- Orbital diagram states: {label: [[up,down], ...]} ----- */
function hundFill(k, m) {
  const a = Array.from({ length: m }, () => [false, false]);
  for (let i = 0; i < k; i++) { if (i < m) a[i][0] = true; else a[i - m][1] = true; }
  return a;
}
function stateFromCounts(c, labels) { const s = {}; for (const l of labels) s[l] = hundFill(c[l] || 0, ORB[tOf(l)]); return s; }
function stateCounts(st) { const c = {}; for (const l in st) c[l] = st[l].reduce((a, o) => a + (o[0] ? 1 : 0) + (o[1] ? 1 : 0), 0); return clean(c); }
function hundIssues(st) {
  const out = [];
  for (const l in st) {
    const orbs = st[l], m = orbs.length;
    const k = orbs.reduce((a, o) => a + o[0] + o[1], 0);
    if (m === 1 || k === 0 || k === 2 * m) continue;
    const paired = orbs.some(o => o[0] && o[1]);
    const empty = orbs.some(o => !o[0] && !o[1]);
    if (paired && empty) out.push({ l, type: 'pair' });
    const singles = orbs.filter(o => o[0] !== o[1]);
    const ups = singles.filter(o => o[0]).length, downs = singles.length - ups;
    if (ups && downs) out.push({ l, type: 'spin' });
  }
  return out;
}
function isGroundState(st, Z) { return sameCounts(stateCounts(st), groundCounts(Z)) && hundIssues(st).length === 0; }

/* Make an excited-state configuration by promoting 1–2 electrons */
function genExcited(Z, maxIdx, rnd = Math.random) {
  const g = groundCounts(Z);
  const occ = FILL.filter(l => g[l] > 0);
  for (let tries = 0; tries < 40; tries++) {
    const srcs = occ.slice(-2);
    const src = srcs[Math.floor(rnd() * srcs.length)];
    const si = FILL.indexOf(src);
    const dests = FILL.slice(si + 1, Math.min(si + 4, maxIdx + 1)).filter(l => (g[l] || 0) < capOf(l));
    if (!dests.length) continue;
    const dst = dests[Math.floor(rnd() * dests.length)];
    const c = { ...g };
    const mv = (c[src] >= 2 && rnd() < 0.25) ? 2 : 1;
    c[src] -= mv; c[dst] = (c[dst] || 0) + Math.min(mv, capOf(dst) - (c[dst] || 0));
    const fixed = clean(c);
    if (total(fixed) === Z && !sameCounts(fixed, g)) return { counts: fixed, src, dst };
  }
  return null;
}


/* ===== UI ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sym = Z => SYMS[Z - 1];
const nm = Z => NAMES[Z - 1];
const sup = n => `<sup>${n}</sup>`;
const rnd = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function load(k, d) { try { const v = localStorage.getItem('ecl-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem('ecl-' + k, JSON.stringify(v)); } catch (e) { } }

const settings = { range: load('range', 36), notation: load('notation', 'either'), bonus: load('bonus', false) };
const DIAG_TOP = { 20: '3d', 36: '4p', 54: '5p' };
const diagLabels = () => FILL.slice(0, FILL.indexOf(DIAG_TOP[settings.range]) + 1);
const diagMaxIdx = () => FILL.indexOf(DIAG_TOP[settings.range]);

/* ---------- formatting ---------- */
function cfgHTML(c, useCore, Z) {
  let core = null, rest = c;
  if (useCore) {
    const iso = isoNoble(c);
    if (iso && Z === 'ion') return `<span class="cfg"><span class="core">[${sym(iso)}]</span></span>`;
    const cz = coreZ(Z === 'ion' || Z == null ? total(c) : Z);
    if (cz && hasFullCore(c, cz)) { core = sym(cz); rest = subtract(c, groundCounts(cz)); }
  }
  const parts = sortedLabels(rest).map(l => `<span class="sl">${l}${sup(rest[l])}</span>`);
  return `<span class="cfg">${core ? `<span class="core">[${core}]</span> ` : ''}${parts.join(' ')}</span>`;
}
function bothForms(c, Z) {
  const full = cfgHTML(c, false, Z);
  const cz = coreZ(Z);
  return cz ? `${full}<span class="or">or</span>${cfgHTML(c, true, Z)}` : full;
}
function chargeTxt(q) { if (!q) return ''; const a = Math.abs(q); return (a === 1 ? '' : a) + (q > 0 ? '+' : '−'); }
function ionName(Z, q) { return `${sym(Z)}${q ? sup(chargeTxt(q)) : ''}`; }

/* ---------- orbital diagrams ---------- */
function arrows(o) {
  return `<svg viewBox="0 0 40 40" aria-hidden="true">${o[0] ? '<path d="M14 34V8M8 14.5L14 7.5 20 14.5"/>' : ''}${o[1] ? '<path d="M26 6v26M20 25.5L26 32.5 32 25.5"/>' : ''}</svg>`;
}
function oDesc(o) { return o[0] && o[1] ? 'paired' : o[0] ? 'one electron, spin up' : o[1] ? 'one electron, spin down' : 'empty'; }
function diagramHTML(labels, st, opts = {}) {
  const rows = labels.slice().reverse().map(l => {
    const boxes = st[l].map((o, i) => opts.interactive
      ? `<button type="button" class="ob" data-l="${l}" data-i="${i}" aria-label="${l} orbital ${i + 1}, ${oDesc(o)}">${arrows(o)}</button>`
      : `<span class="ob" role="img" aria-label="${l} orbital ${i + 1}, ${oDesc(o)}">${arrows(o)}</span>`).join('');
    return `<div class="od-row t-${tOf(l)}${opts.mark && opts.mark.includes(l) ? ' mark' : ''}"><span class="od-lab">${l}</span><div class="od-boxes">${boxes}</div></div>`;
  }).join('');
  return `<div class="od${opts.interactive ? ' live' : ''}${opts.small ? ' small' : ''}"><div class="od-axis" aria-hidden="true"><span>Increasing energy</span></div><div class="od-rows">${rows}${opts.core ? `<div class="od-core">${opts.core} core</div>` : ''}</div></div>`;
}
function cycle(o) {
  if (!o[0] && !o[1]) o[0] = true;
  else if (o[0] && !o[1]) o[1] = true;
  else if (o[0] && o[1]) o[0] = false;
  else o[1] = false;
}
function mountDiagram(el, labels, st, onChange, opts = {}) {
  const draw = (focus) => {
    el.innerHTML = diagramHTML(labels, st, { interactive: true, core: opts.core }) +
      `<p class="od-count">Electrons placed: <b>${total(stateCounts(st))}</b><span class="tiny"> · Click a box: empty → ↑ → ↑↓ → ↓ → empty</span></p>`;
    if (focus) { const b = el.querySelector(`.ob[data-l="${focus[0]}"][data-i="${focus[1]}"]`); b && b.focus(); }
  };
  el.onclick = e => {
    const b = e.target.closest('.ob'); if (!b) return;
    cycle(st[b.dataset.l][+b.dataset.i]);
    draw([b.dataset.l, b.dataset.i]); onChange && onChange();
  };
  draw();
}
function fullDiagramFor(Z) {
  const c = groundCounts(Z);
  const hi = Math.max(...Object.keys(c).map(l => FILL.indexOf(l)));
  if (Z <= 36) { const labels = FILL.slice(0, hi + 1); return { labels, st: stateFromCounts(c, labels), core: null }; }
  const cz = coreZ(Z), ci = Math.max(...Object.keys(groundCounts(cz)).map(l => FILL.indexOf(l)));
  const labels = FILL.slice(ci + 1, hi + 1);
  return { labels, st: stateFromCounts(c, labels), core: `[${sym(cz)}]` };
}

/* ---------- Lewis dot diagrams ---------- */
const SIDES = ['top', 'right', 'bottom', 'left'];
function lewisDefault(v) {
  const s = [0, 0, 0, 0];
  for (let i = 0; i < v; i++) s[i % 4]++;
  return s;
}
function lewisHTML(symbol, sides, opts = {}) {
  const side = (i) => {
    const n = sides[i], dots = '<i></i>'.repeat(n);
    return opts.interactive
      ? `<button type="button" class="lw-side lw-${SIDES[i]}" data-i="${i}" aria-label="${SIDES[i]} side, ${n} dot${n === 1 ? '' : 's'}">${dots || '<span class="lw-hint">+</span>'}</button>`
      : `<span class="lw-side lw-${SIDES[i]}">${dots}</span>`;
  };
  const core = `<div class="lw${opts.interactive ? ' live' : ''}${opts.small ? ' small' : ''}">${side(0)}${side(3)}<span class="lw-sym">${symbol}</span>${side(1)}${side(2)}</div>`;
  if (opts.charge === undefined) return core;
  return `<div class="lw-ion"><span class="br">[</span>${core}<span class="br">]</span><sup class="lw-q">${chargeTxt(opts.charge)}</sup></div>`;
}
function ionLewisHTML(Z, q) {
  if (q > 0) return lewisHTML(sym(Z), [0, 0, 0, 0], { charge: q, small: true });
  if (q < 0) return lewisHTML(sym(Z), [2, 2, 2, 2], { charge: q, small: true });
  return lewisHTML(sym(Z), Z === 2 ? [2, 0, 0, 0] : lewisDefault(valenceOf(Z)), { small: true });
}

/* ---------- periodic table ---------- */
function ptHTML(opts = {}) {
  let cells = '';
  for (let Z = 1; Z <= 118; Z++) {
    const p = posOf(Z), b = blockOf(Z);
    const cls = ['pc', 'b-' + b];
    if (opts.fillTo && Z <= opts.fillTo) cls.push('filled');
    if (opts.fillTo && Z > opts.fillTo) cls.push('faded');
    if (opts.sel === Z) cls.push('sel');
    if (opts.maxZ && Z > opts.maxZ) cls.push('out');
    if (EXC[Z] && opts.showExc) cls.push('exc');
    const tag = opts.clickable ? 'button' : 'span';
    cells += `<${tag} ${opts.clickable ? 'type="button"' : ''} class="${cls.join(' ')}" data-z="${Z}" style="grid-row:${p.r};grid-column:${p.c}" title="${nm(Z)}" aria-label="${nm(Z)}, ${Z}"><small>${Z}</small><b>${sym(Z)}</b></${tag}>`;
  }
  return `<div class="pt-wrap"><div class="pt${opts.mini ? ' mini' : ''}">${cells}<span class="pt-flabel" style="grid-row:9;grid-column:1/3">4f</span><span class="pt-flabel" style="grid-row:10;grid-column:1/3">5f</span></div></div>`;
}
const LEGEND = `<div class="legend"><span class="lg b-s">s block</span><span class="lg b-p">p block</span><span class="lg b-d">d block (n − 1)</span><span class="lg b-f">f block (n − 2)</span></div>`;

function readingPath(Z) {
  const c = aufbauCounts(Z);
  const rows = {};
  for (const l of FILL) if (c[l]) (rows[rowOfSub(l)] = rows[rowOfSub(l)] || []).push(`${l}${sup(c[l])}`);
  return Object.entries(rows).map(([r, a]) => `<li><span class="tiny">Row ${r}:</span> ${a.join(' ')}</li>`).join('');
}

/* ---------- shared grading ---------- */
function gradeConfig(text, Z, notation = 'either') {
  const p = parseConfig(text);
  if (p.errors.length) return { kind: 'bad', msg: p.errors.join('<br>') };
  const c = p.counts, tot = total(c), cz = coreZ(Z);
  if (p.core && p.core >= Z) return { kind: 'bad', msg: `[${sym(p.core)}] already has ${p.core} electrons, but ${nm(Z)} has only ${Z}. Use the noble gas from the row above: [${sym(cz)}].` };
  if (tot !== Z) return { kind: 'bad', msg: `Your configuration has <b>${tot}</b> electrons. ${nm(Z)} has <b>${Z}</b> (its atomic number), so you need ${Z > tot ? Z - tot + ' more' : tot - Z + ' fewer'}.` };
  const g = groundCounts(Z);
  if (!sameCounts(c, g)) {
    if (EXC[Z] && sameCounts(c, aufbauCounts(Z))) return { kind: 'warn', msg: excMsg(Z), aufbau: true };
    const gap = aufbauGap(c);
    if (gap && !EXC[Z]) return { kind: 'bad', msg: `Right number of electrons, but check the <b>Aufbau principle</b>: ${gap.low} isn't full yet, and you already put electrons in ${gap.high}. Fill lower-energy sublevels completely first.` };
    const diff = FILL.find(l => (c[l] || 0) !== (g[l] || 0));
    return { kind: 'bad', msg: `Right number of electrons, but the sublevels don't match the ground state. Look at ${diff}.` };
  }
  if (notation === 'full' && p.core) return { kind: 'warn', msg: 'Your electrons are right. For this one, write the full configuration without the noble gas shorthand.' };
  if (notation === 'core' && cz && !p.core) return { kind: 'warn', msg: `Your electrons are right. Now write it in noble gas shorthand, starting with [${sym(cz)}].` };
  if (p.core && p.core !== cz) return { kind: 'warn', msg: `Your electrons are right, but shorthand uses the closest noble gas before ${nm(Z)}: start with [${sym(cz)}].` };
  const tip = orderIsFillOrder(p.order) ? '' : ' <span class="tiny">Tip: most teachers write sublevels in filling order (for example 4s before 3d).</span>';
  return { kind: 'good', msg: `Correct! ${nm(Z)}: ${bothForms(g, Z)}${tip}` };
}
function excMsg(Z) {
  const e = EXC[Z], s = Object.keys(e).find(l => tOf(l) === 's'), d = Object.keys(e).find(l => tOf(l) === 'd');
  const a = aufbauCounts(Z);
  const moved = (a[s] || 0) - (e[s] || 0);
  const why = e[d] === 10 ? `a completely filled ${d} sublevel (d<sup>10</sup>)` : e[d] === 5 ? `a half-filled ${d} sublevel (d<sup>5</sup>)` : `a lower-energy arrangement (${s} and ${d} are very close in energy)`;
  return `That's what the Aufbau rules <i>predict</i>, but ${nm(Z)} is an exception. ${moved === 1 ? `One ${s} electron moves` : `${moved === 2 ? 'Both' : moved} ${s} electrons move`} into ${d}, giving ${why}.`;
}

}

  const st = certStatus();
  v.innerHTML = `<section class="card"><p class="eyebrow">Finish</p><h2>Completion certificate</h2>
    <p class="lede">Meet every requirement below to unlock your certificate. Then type your name and download it to share with your teacher.</p>
    <ul class="req">${st.rows.map(r => `<li class="${r.met ? 'met' : ''}"><span class="rq-ic" aria-hidden="true">${r.met ? '✓' : '○'}</span><div><b>${r.label}</b><div class="pg-bar"><i style="width:${Math.min(100, 100 * r.c / r.need)}%"></i></div><span class="tiny">${Math.min(r.c, r.need)} of ${r.need} correct needed${r.met ? '' : ` · <a href="#${r.go}">Practice now</a>`}</span></div></li>`).join('')}
    <li class="${st.challenge ? 'met' : ''} opt"><span class="rq-ic" aria-hidden="true">${st.challenge ? '★' : '☆'}</span><div><b>Optional: Exceptions challenge</b><div class="pg-bar"><i style="width:${Math.min(100, 100 * st.ex.c / CERT_CHALLENGE)}%"></i></div><span class="tiny">${Math.min(st.ex.c, CERT_CHALLENGE)} of ${CERT_CHALLENGE} correct adds a gold Challenge seal${st.challenge ? '' : ` · <a href="#exceptions">Try it</a>`}</span></div></li></ul>
    </section>
    <section class="card" id="certCard">${st.done ? `
      <div class="cert-form"><div class="field"><label for="cName">Your name (as your teacher knows it)</label><input id="cName" class="txt" autocomplete="name" maxlength="40"></div>
      <div class="field"><label for="cClass">Class or hour (optional)</label><input id="cClass" class="txt" maxlength="40" placeholder="e.g. Chemistry, Hour 3"></div></div>
      <div class="cert-prev"><img id="certImg" alt="Certificate preview"></div>
      <div class="actions"><button type="button" class="btn primary" id="dlBtn">Download certificate (PNG)</button></div><div id="certMsg"></div>`
      : `<h3>Certificate locked</h3><p>Keep practicing. ${st.rows.filter(r => !r.met).length} requirement${st.rows.filter(r => !r.met).length === 1 ? '' : 's'} left.</p>`}</section>`;
  if (!st.done) return;
  const cv = document.createElement('canvas');
  const nameIn = $('#cName'), classIn = $('#cClass');
  nameIn.value = load('certName', ''); classIn.value = load('certClass', '');
  const render = () => { drawCert(cv, nameIn.value.trim(), classIn.value.trim(), certStatus()); $('#certImg').src = cv.toDataURL('image/png'); };
  const fontsReady = document.fonts ? Promise.all([document.fonts.load('800 70px "Bricolage Grotesque"'), document.fonts.load('400 28px "Atkinson Hyperlegible"'), document.fonts.load('700 28px "Atkinson Hyperlegible"')]).catch(() => { }) : Promise.resolve();
  fontsReady.then(render);
  let tm; [nameIn, classIn].forEach(i => i.addEventListener('input', () => { save('certName', nameIn.value); save('certClass', classIn.value); clearTimeout(tm); tm = setTimeout(render, 150); }));
  const msg = (k, h) => fb($('#certMsg'), k, h);
  $('#certMsg').insertAdjacentHTML('afterend', '<p class="tiny">If nothing downloads, right-click (or long-press) the certificate and choose “Save image as”, or take a screenshot.</p>');
  $('#dlBtn').onclick = async () => {
    const name = nameIn.value.trim();
    if (!name) { msg('bad', 'Type your name first.'); nameIn.focus(); return; }
    render();
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const file = 'Electron-Config-Certificate-' + name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
    const ns = await getDL();
    if (!ns) { // standalone hosting (e.g. Vercel): ordinary browser download
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = file; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      msg('good', 'Certificate downloaded. Check your Downloads folder, then turn it in the way your teacher asked.'); return;
    }
    try { await ns.save({ filename: file, data: blob }); msg('good', 'Certificate saved. Turn it in or share it the way your teacher asked.'); }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') msg('info', 'Download canceled. Click the button again when you\'re ready.');
      else if (c === 'rate_limited') msg('warn', 'A download prompt is already open. Finish that one, then try again.');
      else msg('info', 'Downloading isn\'t available here. Right-click (or long-press) the certificate and choose “Save image”, or take a screenshot.');
    }
  };
}

/* ===================================================================== */
/* REFERENCE PERIODIC TABLE (drawer available on every page) */
let refLabels = load('refLabels', false), refSel = null;
function refTableHTML() {
  let h = '<span class="rt-corner" style="grid-row:1;grid-column:1"></span>';
  for (let g = 1; g <= 18; g++) h += `<span class="rt-g" style="grid-row:1;grid-column:${g + 1}">${g}</span>`;
  for (let r = 1; r <= 7; r++) h += `<span class="rt-p" style="grid-row:${r + 1};grid-column:1">${r}</span>`;
  h += `<span class="rt-p f" style="grid-row:10;grid-column:1/4">4f · row 6</span><span class="rt-p f" style="grid-row:11;grid-column:1/4">5f · row 7</span>`;
  for (let Z = 1; Z <= 118; Z++) {
    const p = posOf(Z), b = blockOf(Z);
    const row = p.r >= 9 ? p.r + 1 : p.r + 1, col = p.c + 1;
    h += `<button type="button" class="rc b-${b}${refSel === Z ? ' sel' : ''}" data-z="${Z}" style="grid-row:${row};grid-column:${col}" aria-label="${nm(Z)}, atomic number ${Z}"><small>${Z}</small><b>${sym(Z)}</b><em>${nm(Z)}</em>${refLabels ? `<span class="rc-sl">${lastAufbauSub(Z)}</span>` : ''}</button>`;
  }
  return `<div class="pt-wrap"><div class="rt">${h}</div></div>`;
}
function drawRef() {
  const d = $('#ptDrawer'); if (!d || d.hidden) return;
  const info = refSel ? (() => { const p = posOf(refSel); return `<b>${nm(refSel)} (${sym(refSel)})</b> · atomic number ${refSel} → ${refSel} electrons · row ${periodOf(refSel)}${p.f ? '' : `, group ${p.c}`} · ${blockOf(refSel)} block`; })() : 'Click an element to see its atomic number, row, and block.';
  $('#ptBody').innerHTML = `${refTableHTML()}
    <div class="rt-foot"><p class="rt-info" aria-live="polite">${info}</p>
    <div class="legend"><span class="lg b-s">s block: sublevel = row</span><span class="lg b-p">p block: sublevel = row</span><span class="lg b-d">d block: row − 1</span><span class="lg b-f">f block: row − 2</span></div></div>`;
}
function initRef() {
  const fab = $('#ptFab'), d = $('#ptDrawer');
  const setOpen = (open) => { d.hidden = !open; fab.setAttribute('aria-expanded', open); document.body.classList.toggle('ref-open', open); fab.textContent = open ? 'Hide periodic table' : 'Periodic table'; if (open) { drawRef(); const target = $('#prompt') || $('main .card'); if (target) target.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } };
  fab.onclick = () => setOpen(d.hidden);
  $('#ptClose').onclick = () => { setOpen(false); fab.focus(); };
  $('#ptLabels').checked = refLabels;
  $('#ptLabels').onchange = () => { refLabels = $('#ptLabels').checked; save('refLabels', refLabels); drawRef(); };
  $('#ptBody').onclick = e => { const c = e.target.closest('.rc'); if (!c) return; refSel = +c.dataset.z; drawRef(); const b = $(`#ptBody .rc[data-z="${refSel}"]`); b && b.focus(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !d.hidden) { setOpen(false); fab.focus(); } });
}

/* ===================================================================== */
/* ROUTER */
const ROUTES = {
  learn: ['Learn', viewLearn, 'Start'], explore: ['Explore the table', viewExplore, 'Start'],
  config: ['Write configs', viewConfig, 'Practice'], orbital: ['Orbital diagrams', viewOrbital, 'Practice'], identify: ['Identify', viewIdentify, 'Practice'], excited: ['Excited states', viewExcited, 'Practice'],
  lewis: ['Lewis dots', viewLewis, 'Practice'], ions: ['Ions', viewIons, 'Practice'], exceptions: ['Exceptions', viewExceptions, 'Challenge'], certificate: ['Certificate', viewCertificate, 'Finish']
};
function route() {
  let r = (location.hash || '').slice(1); if (!ROUTES[r]) r = 'learn';
  $$('#nav a').forEach(a => a.setAttribute('aria-current', a.dataset.r === r ? 'page' : 'false'));
  const v = $('#view'); v.onclick = null;
  ROUTES[r][1](v);
  $('#progWrap').hidden = r === 'learn' || r === 'explore' || r === 'certificate';
  $('#ptFab').hidden = r === 'explore' || r === 'certificate';
  if (r === 'explore' || r === 'certificate') { $('#ptDrawer').hidden = true; document.body.classList.remove('ref-open'); $('#ptFab').textContent = 'Periodic table'; }
  drawProgress();
  window.scrollTo(0, 0);
}
function initNav() {
  let html = '', grp = '';
  for (const [k, [label, , g]] of Object.entries(ROUTES)) {
    if (g !== grp) { html += `${grp ? '</div>' : ''}<div class="ng"><span class="ng-l">${g}</span>`; grp = g; }
    html += `<a href="#${k}" data-r="${k}">${label}</a>`;
  }
  $('#nav').innerHTML = html + '</div>';
  window.addEventListener('hashchange', route);
  initRef();
  route();
}
initNav();

</script>
